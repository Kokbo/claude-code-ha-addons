name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [claudecode, auto-monocle, playwright-browser]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Home Assistant app linter
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./${{ matrix.app }}
